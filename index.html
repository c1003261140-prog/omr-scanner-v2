<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OMR Scanner - Integración 30 Columnas</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 10px; }
    .panel { display: none; flex-direction: column; max-width: 600px; margin: 0 auto; }
    .active { display: flex; }
    select, input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #3b82f6; font-size: 1rem; font-weight:bold;}
    input, select { background: #1e293b; color: white; }
    .btn-green { background: #10b981; color: white; } .btn-blue { background: #3b82f6; color: white; } .btn-red { background: #ef4444; color: white; } .btn-orange { background: #ea580c; color: white;}
    
    .camera-wrapper, .crop-stage { width: 100%; aspect-ratio: 8.5/11; background: #000; margin-bottom: 10px; position: relative; border: 2px solid #3b82f6; border-radius: 6px; overflow: hidden;}
    video, canvas { width: 100%; height: 100%; position: absolute; top:0; left:0; object-fit: cover; }
    
    /* VISTAS DE IMAGEN */
    .visor-pequeno { width: 100%; height: 120px; border: 2px solid #ea580c; background: #000; margin-bottom: 10px; position: relative;}
    #bwCanvas { width: 100%; height: 100%; object-fit: contain; }
    
    .visor-final { width: 100%; height: auto; min-height: 400px; border: 3px solid #10b981; background: #000; margin-bottom: 10px; position: relative; border-radius: 8px;}
    #canvasFinal { width: 100%; height: auto; position: relative; object-fit: contain; display:none;}
    #imgFinalDescarga { width: 100%; height: auto; object-fit: contain; display: none; max-height: 60vh; }
    
    #diagnosticoText { display: none; background: #1e293b; color: #10b981; font-family: monospace; font-size: 0.7rem; padding: 10px; white-space: pre-wrap; overflow-x: auto; margin-top: 20px;}
  </style>
</head>
<body>

  <!-- PANEL 1: CONFIG -->
  <div id="p-config" class="panel active">
    <h2>1. Conexión y Config</h2>
    <input type="password" id="pin" placeholder="Ingrese PIN">
    <button class="btn-blue" id="btnLogin" onclick="iniciar()">Verificar y Cargar Datos</button>
    <select id="selExamen" onchange="cargarAlumnos()"><option>-- Examen --</option></select>
    <select id="selEstudiante"><option>-- Alumno --</option></select>
    <button class="btn-green" id="btnIniciarEscaneo" onclick="abrirCamara()">📸 Tomar Foto</button>
    
    <button class="btn-orange" onclick="verDiagnostico()">🧪 Ver Diagnóstico de Red</button>
    <div id="diagnosticoText">Esperando datos...</div>
  </div>

  <!-- PANEL 2: CÁMARA Y RECORTE -->
  <div id="p-camara" class="panel">
    <h3 style="margin:0; text-align:center;">Encuadre la hoja OMR</h3>
    <div class="camera-wrapper"><video id="video" autoplay playsinline></video></div>
    <button class="btn-green" onclick="tomarFoto()">Capturar</button>
    <button class="btn-red" onclick="switchPanel('p-config')">Cancelar</button>
  </div>
  <div id="p-crop" class="panel">
    <h3 style="margin:0; text-align:center;">Ajuste el recuadro azul a las respuestas</h3>
    <div class="crop-stage"><canvas id="canvasCrop"></canvas></div>
    <button class="btn-blue" onclick="procesar()">⚡ Evaluar</button>
    <button class="btn-red" onclick="switchPanel('p-camara')">Volver a Tomar Foto</button>
  </div>

  <!-- PANEL 3: RESULTADOS -->
  <div id="p-resultado" class="panel">
    <h3 style="margin:0; text-align:center;">Visor de Lectura (B/N)</h3>
    <div class="visor-pequeno"><canvas id="bwCanvas"></canvas></div>
    
    <h3 style="margin:0; text-align:center;">Mantenga presionado para Guardar👇</h3>
    <div class="visor-final">
      <canvas id="canvasFinal"></canvas>
      <img id="imgFinalDescarga" alt="Examen Evaluado">
    </div>
    
    <div id="reviewButtons">
      <button class="btn-blue" onclick="descargarImg()">💾 Guardar Imagen Manualmente</button>
      <button class="btn-green" onclick="enviarSheets()">📤 Enviar a Sheets</button>
      <button class="btn-red" onclick="switchPanel('p-config')">Volver</button>
    </div>
    <div id="loaderUpload" style="display:none; text-align:center; color:#38bdf8; font-weight:bold;">⏳ Enviando datos a Google Sheets...</div>
  </div>

  <script>
    // ==========================================
    // PONGA AQUÍ SU URL (TERMINADA EN /exec)
    // ==========================================
    const URL_APP = "https://script.google.com/macros/s/AKfycbxbdnobu9aBFhXkZEfY8g2TeCiK4HEvjB6Rujp5h3O-PuJsd9j7xIj1JikgHlICXfgAAw/exec"; 

    let examenes = [], alumnos = [], curExamen = null, curAlumno = null;
    let rawImg = null, finalBase64 = "", finalName = "", resData = {};
    let video = document.getElementById('video');
    let cvsCrop = document.getElementById('canvasCrop'), ctxCrop = cvsCrop.getContext('2d');
    let corners = []; let opencvReady = false;
    
    function onOpenCvReady() { opencvReady = true; }
    function switchPanel(id) { document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    async function iniciar() {
      let pin = document.getElementById('pin').value;
      document.getElementById('diagnosticoText').innerText = "Conectando...";
      document.getElementById('btnLogin').innerText = "⏳ Verificando...";
      try {
        let req = await fetch(URL_APP + "?pin=" + pin);
        let res = await req.json();
        if(res.status === "error") throw new Error(res.message);
        examenes = res.examenes; alumnos = res.estudiantes;
        
        document.getElementById('diagnosticoText').innerText = JSON.stringify(examenes[0], null, 2);
        
        let sel = document.getElementById('selExamen'); sel.innerHTML = "<option>-- Examen --</option>";
        examenes.forEach(e => sel.innerHTML += `<option value="${e.id}">[${e.curso}] ${e.tipo} - ${e.tema}</option>`);
        alert("Conexión Exitosa. Matriz de 30 columnas cargada.");
      } catch(e) { 
        alert("Error: " + e.message); 
        document.getElementById('diagnosticoText').innerText = "Fallo de red: " + e.message;
      } finally {
        document.getElementById('btnLogin').innerText = "Verificar y Cargar Datos";
      }
    }

    function cargarAlumnos() {
      curExamen = examenes.find(e => e.id === document.getElementById('selExamen').value);
      let sel = document.getElementById('selEstudiante'); sel.innerHTML = "<option>-- Alumno --</option>";
      alumnos.filter(a => a.curso === curExamen.curso).forEach(a => {
        sel.innerHTML += `<option value='${JSON.stringify(a)}'>${a.n_lista} - ${a.nombre}</option>`;
      });
    }

    function verDiagnostico() {
      let t = document.getElementById('diagnosticoText');
      t.style.display = (t.style.display === "none" || t.style.display === "") ? "block" : "none";
    }

    async function abrirCamara() {
      curAlumno = JSON.parse(document.getElementById('selEstudiante').value);
      switchPanel('p-camara');
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment", width: 1920}});
      video.srcObject = stream;
    }

    function tomarFoto() {
      rawImg = document.createElement('canvas'); rawImg.width = video.videoWidth; rawImg.height = video.videoHeight;
      rawImg.getContext('2d').drawImage(video, 0,0);
      stream.getTracks().forEach(t=>t.stop());
      switchPanel('p-crop');
      cvsCrop.width = cvsCrop.clientWidth; cvsCrop.height = cvsCrop.clientHeight;
      corners = [{x:cvsCrop.width*0.5, y:cvsCrop.height*0.1},{x:cvsCrop.width*0.9, y:cvsCrop.height*0.1},{x:cvsCrop.width*0.9, y:cvsCrop.height*0.9},{x:cvsCrop.width*0.5, y:cvsCrop.height*0.9}];
      drawCrop();
    }

    function drawCrop() {
      ctxCrop.drawImage(rawImg, 0,0, cvsCrop.width, cvsCrop.height);
      ctxCrop.beginPath(); ctxCrop.moveTo(corners[0].x, corners[0].y);
      for(let i=1;i<4;i++) ctxCrop.lineTo(corners[i].x, corners[i].y);
      ctxCrop.closePath(); ctxCrop.lineWidth=3; ctxCrop.strokeStyle="blue"; ctxCrop.stroke();
      corners.forEach(c => { ctxCrop.beginPath(); ctxCrop.arc(c.x, c.y, 15, 0, 2*Math.PI); ctxCrop.fillStyle="blue"; ctxCrop.fill();});
    }

    cvsCrop.addEventListener('touchmove', e => {
      let rect = cvsCrop.getBoundingClientRect(); let x = e.touches[0].clientX - rect.left; let y = e.touches[0].clientY - rect.top;
      let closest = corners.reduce((prev, curr, idx) => { let d = Math.hypot(curr.x-x, curr.y-y); return d < prev.d ? {idx:idx, d:d} : prev; }, {idx:-1, d:1000});
      if(closest.d < 40) { corners[closest.idx] = {x,y}; drawCrop(); }
    });

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        var words = text.split(' '); var line = '';
        for(var n = 0; n < words.length; n++) {
          var testLine = line + words[n] + ' '; var metrics = context.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) { context.fillText(line, x, y); line = words[n] + ' '; y += lineHeight; } 
          else { line = testLine; }
        }
        context.fillText(line, x, y); return y + lineHeight;
    }

    function procesar() {
      if(!opencvReady) { alert("OpenCV está cargando, intente en unos segundos."); return;}
      switchPanel('p-resultado');
      
      let sX = rawImg.width / cvsCrop.width; let sY = rawImg.height / cvsCrop.height;
      let src = cv.imread(rawImg);
      let srcTri = cv.matFromArray(4,1, cv.CV_32FC2, [corners[0].x*sX, corners[0].y*sY, corners[1].x*sX, corners[1].y*sY, corners[2].x*sX, corners[2].y*sY, corners[3].x*sX, corners[3].y*sY]);
      
      let tW = (curExamen.opciones+1)*40; let tH = (curExamen.cant_preguntas+1)*40;
      let dstTri = cv.matFromArray(4,1, cv.CV_32FC2, [0,0, tW,0, tW,tH, 0,tH]);
      let warped = new cv.Mat();
      cv.warpPerspective(src, warped, cv.getPerspectiveTransform(srcTri, dstTri), new cv.Size(tW, tH));

      // Filtro B/N Fijo
      let gray = new cv.Mat(); cv.cvtColor(warped, gray, cv.COLOR_RGBA2GRAY);
      let bin = new cv.Mat(); cv.threshold(gray, bin, 150, 255, cv.THRESH_BINARY_INV);
      cv.imshow('bwCanvas', bin);

      let aciertos = 0; let fallos = 0; let arrAns = []; let rubricTxt = []; let detTxt = []; let incTxt = [];
      
      // Integración a la matriz de rúbricas de 30 columnas
      for(let r=0; r<curExamen.cant_preguntas; r++) {
        let maxP = 0, mIdx = -1;
        for(let c=0; c<curExamen.opciones; c++) {
          let roi = bin.roi(new cv.Rect((c+1)*40+15, (r+1)*40+15, 10, 10));
          let pts = cv.countNonZero(roi); roi.delete();
          if(pts > maxP && pts > 5) { maxP = pts; mIdx = c; }
        }
        let ans = mIdx>=0 ? ["A","B","C","D"][mIdx] : "X";
        let esOk = ans === curExamen.clave[r];
        if(esOk) { 
          aciertos++; 
          let rbAc = (curExamen.rubA && curExamen.rubA[r]) ? curExamen.rubA[r] : "Correcto";
          rubricTxt.push(`✅ P${r+1}: ${rbAc}`); 
        } else { 
          fallos++; 
          incTxt.push(r+1);
          let rbFl = (curExamen.rubF && curExamen.rubF[r]) ? curExamen.rubF[r] : "Revisar";
          rubricTxt.push(`❌ P${r+1}: ${rbFl}`); 
        }
        detTxt.push(`${r+1}:${ans}(${esOk?'OK':'❌'+curExamen.clave[r]})`);
        arrAns.push({idx: mIdx, ok: esOk});
      }

      resData = {aciertos:aciertos, fallos:fallos, nota: Math.round((aciertos/curExamen.cant_preguntas)*100), detalles: detTxt.join(", "), incorrectas: incTxt.join(", ")};

      // DIBUJAR IMAGEN FINAL, SELLOS Y RÚBRICAS
      let canvasF = document.getElementById('canvasFinal');
      canvasF.width = rawImg.width; canvasF.height = rawImg.height;
      let ctxF = canvasF.getContext('2d');
      ctxF.drawImage(rawImg, 0,0);

      // Círculos de calificación
      let mInv = cv.getPerspectiveTransform(dstTri, srcTri);
      arrAns.forEach((a, r) => {
        if(a.idx >= 0) {
          let pt = cv.matFromArray(1,1, cv.CV_32FC2, [(a.idx+1)*40+20, (r+1)*40+20]);
          let out = new cv.Mat(); cv.perspectiveTransform(pt, out, mInv);
          ctxF.beginPath(); ctxF.arc(out.data32F[0], out.data32F[1], 15, 0, 2*Math.PI);
          ctxF.lineWidth=5; ctxF.strokeStyle = a.ok ? "green" : "red"; ctxF.stroke();
          pt.delete(); out.delete();
        }
      });

      // Crear el Sello de Rúbricas
      let stampW = 650; 
      let stampH = 180 + (rubricTxt.length * 35);
      let stampX = canvasF.width - stampW - 30;
      let stampY = canvasF.height - stampH - 30;

      ctxF.fillStyle = "rgba(255,255,255,0.95)";
      ctxF.fillRect(stampX, stampY, stampW, stampH);
      ctxF.lineWidth = 4; ctxF.strokeStyle = "black"; ctxF.strokeRect(stampX, stampY, stampW, stampH);
      
      ctxF.fillStyle = "black"; ctxF.font = "bold 40px Arial";
      ctxF.fillText(`📝 ALUMNO: ${curAlumno.nombre}`, stampX + 20, stampY + 50);
      
      ctxF.fillStyle = resData.nota > 50 ? "green" : "red"; ctxF.font = "bold 50px Arial";
      ctxF.fillText(`NOTA: ${resData.nota}/100`, stampX + 20, stampY + 110);
      
      ctxF.fillStyle = "black"; ctxF.font = "28px Arial";
      ctxF.fillText(`(${aciertos} aciertos, ${fallos} fallos)`, stampX + 300, stampY + 110);

      let rubY = stampY + 160;
      rubricTxt.forEach((rt, i) => {
        ctxF.fillStyle = rt.startsWith("✅") ? "green" : "red";
        rubY = wrapText(ctxF, rt, stampX + 20, rubY, stampW - 40, 35) + 5;
      });

      src.delete(); warped.delete(); gray.delete(); bin.delete(); mInv.delete(); srcTri.delete(); dstTri.delete();
      
      // FORMATEO ESTRICTO DEL ARCHIVO
      let t3 = curExamen.tipo.substring(0,3).toUpperCase();
      let nLimpio = curAlumno.nombre.replace(/[^a-zA-Z0-9]/g, '');
      let d = new Date(); let ms = String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0');
      let fechaStr = String(d.getDate()).padStart(2,'0') + String(d.getMonth()+1).padStart(2,'0') + String(d.getFullYear()).slice(-2);
      
      finalName = `${curExamen.curso}-${t3}-${nLimpio}-${ms}${fechaStr}`;
      
      finalBase64 = canvasF.toDataURL('image/jpeg', 0.85);
      let imgTag = document.getElementById('imgFinalDescarga');
      imgTag.src = finalBase64;
      imgTag.style.display = "block";
    }

    function descargarImg() {
      let a = document.createElement("a"); a.href = finalBase64; a.download = finalName + ".jpg";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      alert("Descargado como: " + finalName + ".jpg");
    }

    async function enviarSheets() {
      document.getElementById('reviewButtons').style.display = 'none';
      document.getElementById('loaderUpload').style.display = 'block';

      let p = {
        pin: document.getElementById('pin').value, idExamen: curExamen.id, curso: curExamen.curso, 
        tipo: curExamen.tipo, trimestre: curExamen.trimestre, nLista: curAlumno.n_lista, nombre: curAlumno.nombre, 
        aciertos: resData.aciertos, fallos: resData.fallos, totalPreguntas: curExamen.cant_preguntas, 
        nota100: resData.nota, detalleRespuestas: resData.detalles, preguntasIncorrectas: resData.incorrectas, fileName: finalName
      };
      
      try {
        let req = await fetch(URL_APP, { method: "POST", body: JSON.stringify(p), headers: {"Content-Type": "text/plain"} });
        let res = await req.json();
        if(res.status === "success") { 
            alert("✅ Calificación enviada y registrada correctamente."); 
            switchPanel('p-config'); 
        }
        else throw new Error(res.message);
      } catch(e) { 
          alert("Error al enviar: " + e.message); 
          document.getElementById('reviewButtons').style.display = 'block';
      } finally {
          document.getElementById('loaderUpload').style.display = 'none';
      }
    }
  </script>
</body>
</html>
