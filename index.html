<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OMR Scanner - App Móvil Estudiantes</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 10px; touch-action: pan-y;}
    .panel { display: none; flex-direction: column; max-width: 600px; margin: 0 auto; }
    .active { display: flex; }
    select, input, button { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #3b82f6; font-size: 1.1rem; font-weight:bold; box-sizing:border-box;}
    input, select { background: #1e293b; color: white; }
    .btn-green { background: #10b981; color: white; } .btn-blue { background: #3b82f6; color: white; } .btn-red { background: #ef4444; color: white; } .btn-orange { background: #ea580c; color: white;}
    
    .camera-wrapper, .crop-stage, .page-crop-stage { width: 100%; aspect-ratio: 8.5/11; background: #000; margin-bottom: 15px; position: relative; border: 2px solid #3b82f6; border-radius: 8px; overflow: hidden; touch-action: none;}
    .page-crop-stage { border-color: #ea580c; } .crop-stage { border-color: #10b981; }
    video, canvas { width: 100%; height: 100%; position: absolute; top:0; left:0; object-fit: cover; }
    
    .filter-panel { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #3b82f6; text-align: center;}
    .filter-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .filter-row label { font-size: 0.9rem; color: #94a3b8; width: 70px; font-weight: bold;}
    .filter-row input[type=range] { flex: 1; margin: 0 10px; accent-color: #3b82f6; height: 25px;}
    .filter-row span { font-size: 0.9rem; color: #f8fafc; width: 35px; text-align: right; }

    .visor-pequeno { width: 50%; height: auto; aspect-ratio: 1/1; border: 2px solid #ea580c; background: #000; margin: 10px auto; position: relative; border-radius:6px; overflow:hidden;}
    #bwCanvas { width: 100%; height: 100%; object-fit: contain; }
    
    .visor-final { width: 100%; height: auto; min-height: 400px; border: 3px solid #10b981; background: #000; margin-bottom: 15px; position: relative; border-radius: 8px; text-align:center;}
    #canvasFinal { display: block; width: 100%; height: auto; object-fit: contain;}
    
    #manualEditor { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #10b981; }
    .editor-title { font-size: 0.95rem; font-weight: bold; color: #f8fafc; margin-bottom: 10px; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 5px; }
    #editorFilas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .edit-row { display: flex; flex-direction: column; align-items: center; padding: 6px; background: #0f172a; border-radius: 6px; border: 1px solid #334155;}
    .edit-row span { font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; text-align: center;}
    .edit-row select { width: 100%; padding: 6px; background: #1e293b; color: white; border: 1px solid #3b82f6; border-radius: 4px; font-weight: bold; font-size: 0.9rem; text-align: center; outline: none; }
    .c-ok { color: #10b981; } .c-err { color: #ef4444; }

    #diagnosticoText { display: none; background: #1e293b; color: #10b981; font-family: monospace; font-size: 0.75rem; padding: 12px; white-space: pre-wrap; overflow-x: auto; margin-top: 10px; border-radius: 6px;}
    .instruccion { text-align:center; font-size: 1rem; color: #94a3b8; font-weight:bold; margin-bottom:10px;}
  </style>
</head>
<body>

  <!-- PANEL 1: CONFIG -->
  <div id="p-config" class="panel active">
    <h2 style="text-align:center; margin-top:0;">1. Configuración</h2>
    <input type="password" id="pin" placeholder="Ingrese PIN de Seguridad">
    <button class="btn-blue" id="btnLogin" onclick="iniciar()">Verificar y Cargar Datos</button>
    <select id="selExamen" onchange="cargarAlumnos()"><option>-- Examen --</option></select>
    <select id="selEstudiante"><option>-- Estudiante --</option></select>
    <button class="btn-green" id="btnIniciarEscaneo" onclick="abrirCamara()">📸 Tomar Foto</button>
    
    <button class="btn-orange" onclick="verDiagnostico()">🧪 Ver Diagnóstico</button>
    <div id="diagnosticoText">Esperando datos...</div>
  </div>

  <!-- PANEL 2: CÁMARA Y RECORTE -->
  <div id="p-camara" class="panel">
    <div class="instruccion">Encuadre toda la hoja y capture.</div>
    <div class="camera-wrapper"><video id="video" autoplay playsinline></video></div>
    <button class="btn-green" onclick="tomarFoto()">Capturar</button>
    <button class="btn-red" onclick="switchPanel('p-config')">Cancelar</button>
  </div>
  
  <div id="p-crop-mesa" class="panel">
    <div class="instruccion" style="color:#ea580c;">Arrastre las líneas para recortar el fondo.</div>
    <div class="page-crop-stage"><canvas id="canvasMesa"></canvas></div>
    <button class="btn-orange" onclick="confirmarMesa()">✂️ Aceptar Recorte</button>
    <button class="btn-red" onclick="switchPanel('p-camara')">Reintentar Foto</button>
  </div>

  <div id="p-crop" class="panel">
    <div class="instruccion" style="color:#10b981;">Ajuste el recuadro a las respuestas.</div>
    <div class="crop-stage"><canvas id="canvasCrop"></canvas></div>
    <button class="btn-blue" onclick="procesar()">⚡ Evaluar</button>
    <button class="btn-red" onclick="switchPanel('p-camara')">Reintentar Foto</button>
  </div>

  <!-- PANEL 3: RESULTADOS Y EDICIÓN MANUAL -->
  <div id="p-resultado" class="panel">
    <div class="filter-panel">
      <div class="filter-row"><label>Brillo</label><input type="range" id="slBrillo" min="-100" max="100" value="-25" oninput="aplicarFiltrosBinarizacion()"><span id="valBrillo">-25</span></div>
      <div class="filter-row"><label>Contraste</label><input type="range" id="slContraste" min="10" max="40" value="24" oninput="aplicarFiltrosBinarizacion()"><span id="valContraste">2.4</span></div>
      <div class="filter-row"><label>Lápiz</label><input type="range" id="slUmbral" min="100" max="250" value="168" oninput="aplicarFiltrosBinarizacion()"><span id="valUmbral">168</span></div>
      <div class="visor-pequeno"><canvas id="bwCanvas"></canvas></div>
    </div>
    
    <div class="instruccion" style="color:#10b981;">Mantenga presionado para Guardar👇</div>
    <div class="visor-final">
      <canvas id="canvasFinal"></canvas>
    </div>

    <!-- REVISIÓN MANUAL -->
    <div id="manualEditor">
      <div class="editor-title">✏️ REVISIÓN MANUAL</div>
      <div id="editorFilas"></div>
    </div>
    
    <div id="reviewButtons">
      <button class="btn-blue" onclick="descargarImg()">💾 Guardar Imagen Manualmente</button>
      <button class="btn-green" onclick="enviarSheets()">📤 Enviar a Sheets</button>
      <button class="btn-red" onclick="switchPanel('p-config')">Volver</button>
    </div>
    <div id="loaderUpload" style="display:none; text-align:center; color:#38bdf8; font-weight:bold; font-size:1.2rem; margin-top:20px;">⏳ Enviando datos a Sheets...</div>
  </div>

  <script>
    // ==========================================
    // PONGA AQUÍ SU URL (TERMINADA EN /exec)
    // ==========================================
    const URL_APP = "https://script.google.com/macros/s/AKfycbxbdnobu9aBFhXkZEfY8g2TeCiK4HEvjB6Rujp5h3O-PuJsd9j7xIj1JikgHlICXfgAAw/exec"; 

    let examenes = [], alumnos = [], curExamen = null, curAlumno = null;
    let rawImg = null, mesaImg = null, finalBase64 = "", finalName = "", resData = {};
    let video = document.getElementById('video');
    let arregloRespuestasManuales = [];
    
    let cvsMesa = document.getElementById('canvasMesa'), ctxMesa = cvsMesa.getContext('2d');
    let cvsCrop = document.getElementById('canvasCrop'), ctxCrop = cvsCrop.getContext('2d');
    let bwCanvas = document.getElementById('bwCanvas');
    
    let lineTop = 0, lineBot = 0, activeLine = null;
    let corners = []; let opencvReady = false;
    let activeHandle = null; let dragOffset = {x:0, y:0};
    
    function onOpenCvReady() { opencvReady = true; }
    function switchPanel(id) { document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0);}

    async function iniciar() {
      let pin = document.getElementById('pin').value;
      document.getElementById('diagnosticoText').innerText = "Conectando...";
      document.getElementById('btnLogin').innerText = "⏳ Verificando...";
      try {
        let req = await fetch(URL_APP + "?pin=" + pin);
        let res = await req.json();
        if(res.status === "error") throw new Error(res.message);
        examenes = res.examenes; alumnos = res.estudiantes;
        
        document.getElementById('diagnosticoText').innerText = JSON.stringify(examenes[0], null, 2);
        
        let sel = document.getElementById('selExamen'); sel.innerHTML = "<option>-- Examen --</option>";
        examenes.forEach(e => sel.innerHTML += `<option value="${e.id}">[${e.curso}] ${e.tipo} - ${e.tema}</option>`);
        alert("Conexión Exitosa.");
      } catch(e) { 
        alert("Error: " + e.message); 
        document.getElementById('diagnosticoText').innerText = "Fallo de red: " + e.message;
      } finally {
        document.getElementById('btnLogin').innerText = "Verificar y Cargar Datos";
      }
    }

    function cargarAlumnos() {
      curExamen = examenes.find(e => e.id === document.getElementById('selExamen').value);
      let sel = document.getElementById('selEstudiante'); sel.innerHTML = "<option>-- Estudiante --</option>";
      alumnos.filter(a => a.curso === curExamen.curso).forEach(a => {
        sel.innerHTML += `<option value='${JSON.stringify(a)}'>${a.n_lista} - ${a.nombre}</option>`;
      });
    }

    function verDiagnostico() {
      let t = document.getElementById('diagnosticoText');
      t.style.display = (t.style.display === "none" || t.style.display === "") ? "block" : "none";
    }

    async function abrirCamara() {
      curAlumno = JSON.parse(document.getElementById('selEstudiante').value);
      switchPanel('p-camara');
      try {
          stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment", width: {ideal: 1920}}});
          video.srcObject = stream;
      } catch (e) { alert("Permita la cámara.");}
    }

    function tomarFoto() {
      rawImg = document.createElement('canvas'); rawImg.width = video.videoWidth; rawImg.height = video.videoHeight;
      rawImg.getContext('2d').drawImage(video, 0,0);
      stream.getTracks().forEach(t=>t.stop());
      
      switchPanel('p-crop-mesa');
      cvsMesa.width = cvsMesa.clientWidth; cvsMesa.height = cvsMesa.clientHeight;
      lineTop = cvsMesa.height * 0.05; lineBot = cvsMesa.height * 0.95;
      dibujarMesa();
    }

    function dibujarMesa() {
      ctxMesa.clearRect(0,0, cvsMesa.width, cvsMesa.height);
      ctxMesa.drawImage(rawImg, 0,0, cvsMesa.width, cvsMesa.height);
      ctxMesa.fillStyle = "rgba(0,0,0,0.6)"; 
      ctxMesa.fillRect(0,0, cvsMesa.width, lineTop);
      ctxMesa.fillRect(0, lineBot, cvsMesa.width, cvsMesa.height - lineBot);
      
      ctxMesa.beginPath(); ctxMesa.moveTo(0, lineTop); ctxMesa.lineTo(cvsMesa.width, lineTop);
      ctxMesa.lineWidth=6; ctxMesa.strokeStyle="red"; ctxMesa.stroke();
      
      ctxMesa.beginPath(); ctxMesa.moveTo(0, lineBot); ctxMesa.lineTo(cvsMesa.width, lineBot);
      ctxMesa.lineWidth=6; ctxMesa.strokeStyle="yellow"; ctxMesa.stroke();
    }

    cvsMesa.addEventListener('pointerdown', e => {
      let rect = cvsMesa.getBoundingClientRect(); let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      if(Math.abs(y - lineTop) < 50) activeLine = "top"; else if(Math.abs(y - lineBot) < 50) activeLine = "bot";
    });
    cvsMesa.addEventListener('pointermove', e => {
      if(!activeLine) return;
      let rect = cvsMesa.getBoundingClientRect(); let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      if(activeLine === "top") lineTop = Math.max(0, Math.min(lineBot-50, y));
      if(activeLine === "bot") lineBot = Math.max(lineTop+50, Math.min(cvsMesa.height, y));
      dibujarMesa();
    });
    window.addEventListener('pointerup', () => activeLine = null);

    function confirmarMesa() {
      let sY = rawImg.height / cvsMesa.height;
      let rT = lineTop * sY; let rH = (lineBot - lineTop) * sY;
      mesaImg = document.createElement('canvas'); mesaImg.width = rawImg.width; mesaImg.height = rH;
      mesaImg.getContext('2d').drawImage(rawImg, 0, rT, rawImg.width, rH, 0, 0, rawImg.width, rH);
      
      switchPanel('p-crop');
      cvsCrop.width = cvsCrop.clientWidth; cvsCrop.height = cvsCrop.clientHeight;
      corners = [{x:cvsCrop.width*0.5, y:cvsCrop.height*0.1},{x:cvsCrop.width*0.9, y:cvsCrop.height*0.1},{x:cvsCrop.width*0.9, y:cvsCrop.height*0.9},{x:cvsCrop.width*0.5, y:cvsCrop.height*0.9}];
      drawCrop();
    }

    function drawCrop() {
      ctxCrop.drawImage(mesaImg, 0,0, cvsCrop.width, cvsCrop.height);
      ctxCrop.beginPath(); ctxCrop.moveTo(corners[0].x, corners[0].y);
      for(let i=1;i<4;i++) ctxCrop.lineTo(corners[i].x, corners[i].y);
      ctxCrop.closePath(); ctxCrop.lineWidth=3; ctxCrop.strokeStyle="blue"; ctxCrop.stroke();
      corners.forEach(c => { ctxCrop.beginPath(); ctxCrop.arc(c.x, c.y, 20, 0, 2*Math.PI); ctxCrop.fillStyle="blue"; ctxCrop.fill();});
    }

    // --- RECUADRO AZUL ARRASTRABLE COMPLETO ---
    function getTouchPos(e) { let rect = cvsCrop.getBoundingClientRect(); let cx = e.touches ? e.touches[0].clientX : e.clientX; let cy = e.touches ? e.touches[0].clientY : e.clientY; return { x: cx - rect.left, y: cy - rect.top }; }
    function distToSegment(p, v, w) { let l2 = Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2); if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y); let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2; t = Math.max(0, Math.min(1, t)); return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y))); }
    function pointInPolygon(point, vs) { let x = point.x, y = point.y; let inside = false; for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) { let xi = vs[i].x, yi = vs[i].y; let xj = vs[j].x, yj = vs[j].y; let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi); if (intersect) inside = !inside; } return inside; }

    cvsCrop.addEventListener('pointerdown', (e) => {
      let pos = getTouchPos(e); activeHandle = null;
      for (let i=0; i<4; i++) { if (Math.hypot(corners[i].x - pos.x, corners[i].y - pos.y) < 40) { activeHandle = i; return; } }
      if (pointInPolygon(pos, corners)) { activeHandle = "center"; dragOffset = pos; return; }
      for (let i=0; i<4; i++) { let j = (i + 1) % 4; if (distToSegment(pos, corners[i], corners[j]) < 40) { activeHandle = `edge_${i}`; dragOffset = pos; return; } }
    });

    cvsCrop.addEventListener('pointermove', (e) => {
      if (activeHandle === null) return;
      let pos = getTouchPos(e); let dx = pos.x - dragOffset.x; let dy = pos.y - dragOffset.y;
      if (typeof activeHandle === 'number') { corners[activeHandle].x = Math.max(0, Math.min(cvsCrop.width, pos.x)); corners[activeHandle].y = Math.max(0, Math.min(cvsCrop.height, pos.y)); } 
      else if (activeHandle === "center") { corners.forEach(c => { c.x += dx; c.y += dy; }); dragOffset = pos; } 
      else if (activeHandle.startsWith("edge_")) { let edgeIdx = parseInt(activeHandle.split("_")[1]); let nextIdx = (edgeIdx + 1) % 4; corners[edgeIdx].x += dx; corners[edgeIdx].y += dy; corners[nextIdx].x += dx; corners[nextIdx].y += dy; dragOffset = pos; }
      drawCrop();
    });
    window.addEventListener('pointerup', () => { activeHandle = null; });


    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        var words = text.split(' '); var line = '';
        for(var n = 0; n < words.length; n++) {
          var testLine = line + words[n] + ' '; var metrics = context.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) { context.fillText(line, x, y); line = words[n] + ' '; y += lineHeight; } 
          else { line = testLine; }
        }
        context.fillText(line, x, y); return y + lineHeight;
    }

    let warpedMatBase = null;

    function procesar() {
      if(!opencvReady) { alert("Cargando OpenCV..."); return;}
      switchPanel('p-resultado');
      
      let sX = mesaImg.width / cvsCrop.width; let sY = mesaImg.height / cvsCrop.height;
      let src = cv.imread(mesaImg);
      let srcTri = cv.matFromArray(4,1, cv.CV_32FC2, [corners[0].x*sX, corners[0].y*sY, corners[1].x*sX, corners[1].y*sY, corners[2].x*sX, corners[2].y*sY, corners[3].x*sX, corners[3].y*sY]);
      
      let tW = (curExamen.opciones+1)*40; let tH = (curExamen.cant_preguntas+1)*40;
      let dstTri = cv.matFromArray(4,1, cv.CV_32FC2, [0,0, tW,0, tW,tH, 0,tH]);
      if(warpedMatBase) warpedMatBase.delete();
      warpedMatBase = new cv.Mat();
      cv.warpPerspective(src, warpedMatBase, cv.getPerspectiveTransform(srcTri, dstTri), new cv.Size(tW, tH));

      src.delete(); srcTri.delete(); dstTri.delete();
      aplicarFiltrosBinarizacion();
    }

    function aplicarFiltrosBinarizacion() {
      let valB = parseInt(document.getElementById('slBrillo').value); 
      let valC = parseInt(document.getElementById('slContraste').value) / 10; 
      let valU = parseInt(document.getElementById('slUmbral').value);
      
      document.getElementById('valBrillo').innerText = valB; 
      document.getElementById('valContraste').innerText = valC.toFixed(1); 
      document.getElementById('valUmbral').innerText = valU;

      let gray = new cv.Mat(); cv.cvtColor(warpedMatBase, gray, cv.COLOR_RGBA2GRAY);
      let adjusted = new cv.Mat(); gray.convertTo(adjusted, -1, valC, valB);
      let bin = new cv.Mat(); cv.threshold(adjusted, bin, valU, 255, cv.THRESH_BINARY_INV);
      cv.imshow('bwCanvas', bin);

      arregloRespuestasManuales = [];
      for(let r=0; r<curExamen.cant_preguntas; r++) {
        let maxP = 0, mIdx = -1;
        for(let c=0; c<curExamen.opciones; c++) {
          let roi = bin.roi(new cv.Rect((c+1)*40+15, (r+1)*40+15, 10, 10));
          let pts = cv.countNonZero(roi); roi.delete();
          if(pts > maxP && pts > 5) { maxP = pts; mIdx = c; }
        }
        let ans = mIdx>=0 ? ["A","B","C","D"][mIdx] : "BLANCO";
        arregloRespuestasManuales.push(ans);
      }

      gray.delete(); adjusted.delete(); bin.delete();
      renderizarResultadosYEditor();
    }

    function actualizarRespuestaManual(idx, valor) { 
        arregloRespuestasManuales[idx] = valor; 
        renderizarResultadosYEditor(); 
    }

    function renderizarResultadosYEditor() {
      let aciertos = 0; let fallos = 0; let rubricTxt = []; let detTxt = []; let incTxt = []; let htmlEditor = "";
      
      let arrAns = [];

      for(let r=0; r<curExamen.cant_preguntas; r++) {
        let ans = arregloRespuestasManuales[r];
        let esOk = ans === curExamen.clave[r];
        
        if(esOk) { 
          aciertos++; 
          let rbAc = (curExamen.rubA && curExamen.rubA[r]) ? curExamen.rubA[r] : "Correcto";
          rubricTxt.push(`✅ P${r+1}: ${rbAc}`); 
        } else { 
          fallos++; 
          incTxt.push(r+1);
          let rbFl = (curExamen.rubF && curExamen.rubF[r]) ? curExamen.rubF[r] : "Revisar";
          rubricTxt.push(`❌ P${r+1}: ${rbFl}`); 
        }
        
        detTxt.push(`${r+1}:${ans}(${esOk?'OK':'❌'+curExamen.clave[r]})`);
        arrAns.push({idx: ["A","B","C","D"].indexOf(ans), ok: esOk});

        // Generar UI Manual Editor
        let opts = ["A", "B", "C", "D"].slice(0, curExamen.opciones); opts.push("BLANCO");
        let optString = opts.map(o => `<option value="${o}" ${o===ans?'selected':''}>${o}</option>`).join("");
        let classColor = esOk ? 'c-ok' : 'c-err';
        htmlEditor += `<div class="edit-row"><span class="${classColor}">P${r+1}. (Resp: ${curExamen.clave[r]})</span><select onchange="actualizarRespuestaManual(${r}, this.value)">${optString}</select></div>`;
      }

      document.getElementById('editorFilas').innerHTML = htmlEditor;

      resData = {aciertos:aciertos, fallos:fallos, nota: Math.round((aciertos/curExamen.cant_preguntas)*100), detalles: detTxt.join(", "), incorrectas: incTxt.join(", ")};

      // DIBUJAR FINAL
      let canvasF = document.getElementById('canvasFinal');
      canvasF.width = mesaImg.width; canvasF.height = mesaImg.height;
      let ctxF = canvasF.getContext('2d');
      ctxF.drawImage(mesaImg, 0,0);

      let sX = mesaImg.width / cvsCrop.width; let sY = mesaImg.height / cvsCrop.height;
      let srcTri = cv.matFromArray(4,1, cv.CV_32FC2, [corners[0].x*sX, corners[0].y*sY, corners[1].x*sX, corners[1].y*sY, corners[2].x*sX, corners[2].y*sY, corners[3].x*sX, corners[3].y*sY]);
      let tW = (curExamen.opciones+1)*40; let tH = (curExamen.cant_preguntas+1)*40;
      let dstTri = cv.matFromArray(4,1, cv.CV_32FC2, [0,0, tW,0, tW,tH, 0,tH]);
      let mInv = cv.getPerspectiveTransform(dstTri, srcTri);

      arrAns.forEach((a, r) => {
        if(a.idx >= 0) {
          let pt = cv.matFromArray(1,1, cv.CV_32FC2, [(a.idx+1)*40+20, (r+1)*40+20]);
          let out = new cv.Mat(); cv.perspectiveTransform(pt, out, mInv);
          ctxF.beginPath(); ctxF.arc(out.data32F[0], out.data32F[1], 15, 0, 2*Math.PI);
          ctxF.lineWidth=6; ctxF.strokeStyle = a.ok ? "green" : "red"; ctxF.stroke();
          pt.delete(); out.delete();
        }
      });

      // SELLO DINÁMICO (MITAD DE TAMAÑO Y ALINEADO DEBAJO DE LA MATRIZ A LA DERECHA)
      let matrixRightX = Math.max(corners[1].x, corners[2].x) * sX;
      let matrixBottomY = Math.max(corners[2].y, corners[3].y) * sY;
      
      let stampW = 380; 
      let stampH = 100 + (rubricTxt.length * 16);
      let stampX = matrixRightX - stampW + 60; // Push to the right
      if (stampX + stampW > canvasF.width - 20) stampX = canvasF.width - stampW - 20; // Bound to screen
      let stampY = matrixBottomY + 40; 
      
      if(stampX < 20) stampX = 20;
      if(stampY + stampH > canvasF.height - 20) stampY = canvasF.height - stampH - 20;

      ctxF.fillStyle = "rgba(255,255,255,0.95)";
      ctxF.fillRect(stampX, stampY, stampW, stampH);
      ctxF.lineWidth = 3; ctxF.strokeStyle = "black"; ctxF.strokeRect(stampX, stampY, stampW, stampH);
      
      ctxF.fillStyle = "black"; ctxF.font = "bold 16px Arial";
      ctxF.fillText(`📝 ESTUDIANTE: ${curAlumno.nombre}`, stampX + 15, stampY + 25);
      ctxF.fillText(`📚 CURSO: ${curExamen.curso}`, stampX + 15, stampY + 45);
      
      ctxF.fillStyle = resData.nota > 50 ? "green" : "red"; ctxF.font = "bold 22px Arial";
      ctxF.fillText(`NOTA: ${resData.nota}/100`, stampX + 15, stampY + 75);
      
      ctxF.fillStyle = "black"; ctxF.font = "14px Arial";
      ctxF.fillText(`(${aciertos} aciertos, ${fallos} fallos)`, stampX + 180, stampY + 75);

      let rubY = stampY + 100;
      ctxF.font = "12px Arial";
      rubricTxt.forEach((rt) => {
        ctxF.fillStyle = rt.startsWith("✅") ? "green" : "red";
        rubY = wrapText(ctxF, rt, stampX + 15, rubY, stampW - 25, 16) + 2;
      });

      mInv.delete(); srcTri.delete(); dstTri.delete();
      
      // FORMATEO ESTRICTO DEL ARCHIVO
      let t3 = curExamen.tipo.substring(0,3).toUpperCase();
      let tema4 = curExamen.tema.replace(/[^a-zA-Z0-9]/g, '').substring(0,4).toUpperCase();
      let d = new Date(); let ms = String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0');
      let fechaStr = String(d.getDate()).padStart(2,'0') + String(d.getMonth()+1).padStart(2,'0') + String(d.getFullYear()).slice(-2);
      
      finalName = `${curExamen.curso}-${t3}-${tema4}-${ms}${fechaStr}`;
      
      finalBase64 = canvasF.toDataURL('image/jpeg', 0.85);
    }

    function descargarImg() {
      let a = document.createElement("a"); a.href = finalBase64; a.download = finalName + ".jpg";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      alert("Descargado como: " + finalName + ".jpg");
    }

    async function enviarSheets() {
      document.getElementById('reviewButtons').style.display = 'none';
      document.getElementById('loaderUpload').style.display = 'block';

      let p = {
        pin: document.getElementById('pin').value, idExamen: curExamen.id, curso: curExamen.curso, 
        tipo: curExamen.tipo, trimestre: curExamen.trimestre, nLista: curAlumno.n_lista, nombre: curAlumno.nombre, 
        aciertos: resData.aciertos, fallos: resData.fallos, totalPreguntas: curExamen.cant_preguntas, 
        nota100: resData.nota, detalleRespuestas: resData.detalles, preguntasIncorrectas: resData.incorrectas, fileName: finalName
      };
      
      try {
        let req = await fetch(URL_APP, { method: "POST", body: JSON.stringify(p), headers: {"Content-Type": "text/plain"}, redirect: "follow" });
        let res = await req.json();
        if(res.status === "success") { 
            alert("✅ Calificación enviada y registrada correctamente."); 
            switchPanel('p-config'); 
        }
        else throw new Error(res.message);
      } catch(e) { 
          alert("Error al enviar: " + e.message); 
          document.getElementById('reviewButtons').style.display = 'flex';
      } finally {
          document.getElementById('loaderUpload').style.display = 'none';
      }
    }
  </script>
